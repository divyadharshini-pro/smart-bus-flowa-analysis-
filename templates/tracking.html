<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBus Flow - Tracking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #173b7a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #173b7a;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .title-box,
        .tracking-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .title-box h1 {
            margin-top: 0;
            color: #173b7a;
        }

        .map {
            width: 100%;
            height: 450px;
            background: #e8eef7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
            margin-bottom: 20px;
            position: relative;
        }

        .bus-marker {
            position: absolute;
            font-size: 40px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .info-box {
            background: #f4f7fb;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            color: #173b7a;
            margin-bottom: 6px;
        }
