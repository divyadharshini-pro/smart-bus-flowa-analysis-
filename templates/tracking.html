<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartBus Flow - Live Map</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

        }


        header {

            background: #173b7a;

            color: white;

            padding: 18px;

            text-align: center;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 15px;

        }


        .card {

            background: white;

            padding: 18px;

            margin-bottom: 15px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

        }


        #map {

            width: 100%;

            height: 500px;

            border-radius: 10px;

        }


        .bus-card {

            border: 1px solid #ddd;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 10px;

        }


        .live {

            color: green;

            font-weight: bold;

        }


        .offline {

            color: red;

            font-weight: bold;

        }


        .back {

            display: inline-block;

            padding: 12px 18px;

            background: #173b7a;

            color: white;

            text-decoration: none;

            border-radius: 7px;

        }


        @media(max-width:600px) {

            #map {

                height: 400px;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>🚌 SmartBus Flow</h1>

    <p>Real-Time Bus Tracking</p>

</header>


<div class="container">


    <div class="card">

        <h2>🗺️ Live Bus Map</h2>

        <p>

            Map automatically updates every 3 seconds.

        </p>

        <div id="map"></div>

    </div>


    <div class="card">

        <h2>🚍 Bus Status</h2>

        <div id="busList">

            Loading...

        </div>

    </div>


    <a
        href="/admin"
        class="back"
    >

        ← Back to Admin

    </a>


</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

let map;

let markers = {};


function createMap() {

    map =
        L.map("map")
        .setView(
            [11.6643, 78.1460],
            9
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    ).addTo(map);

}


function loadBuses() {

    fetch("/api/buses")

    .then(
        response =>
            response.json()
    )

    .then(
        buses => {

            updateBusList(
                buses
            );

            updateMarkers(
                buses
            );

        }
    )

    .catch(
        error => {

            console.error(
                error
            );

        }
    );

}


function updateBusList(buses) {

    const list =
        document.getElementById(
            "busList"
        );


    if (!buses.length) {

        list.innerHTML =
            "No buses available.";

        return;

    }


    let html = "";


    buses.forEach(
        bus => {

            const className =
                bus.status === "Live"
                ? "live"
                : "offline";


            html += `

                <div class="bus-card">

                    <h3>
                        🚌 ${bus.bus_number}
                    </h3>

                    <b>Driver:</b>
                    ${bus.driver}

                    <br><br>

                    <b>Phone:</b>
                    ${bus.phone}

                    <br><br>

                    <b>Route:</b>
                    ${bus.route}

                    <br><br>

                    <b>Location:</b>
                    ${bus.latitude},
                    ${bus.longitude}

                    <br><br>

                    <b>Speed:</b>
                    ${bus.speed} km/h

                    <br><br>

                    <b>Status:</b>

                    <span class="${className}">

                        ${bus.status}

                    </span>

                </div>

            `;

        }
    );


    list.innerHTML = html;

}


function updateMarkers(buses) {

    buses.forEach(
        bus => {

            const lat =
                parseFloat(
                    bus.latitude
                );


            const lng =
                parseFloat(
                    bus.longitude
                );


            if (
                !lat ||
                !lng
            ) {

                return;

            }


            const popup = `

                <b>🚌 ${bus.bus_number}</b>

                <br><br>

                Driver:
                ${bus.driver}

                <br>

                Route:
                ${bus.route}

                <br>

                Speed:
                ${bus.speed} km/h

                <br>

                Status:
                ${bus.status}

            `;


            if (
                markers[
                    bus.bus_number
                ]
            ) {

                markers[
                    bus.bus_number
                ]
                .setLatLng(
                    [lat, lng]
                )
                .setPopupContent(
                    popup
                );

            }

            else {

                markers[
                    bus.bus_number
                ] =

                    L.marker(
                        [lat, lng]
                    )
                    .addTo(map)
                    .bindPopup(
                        popup
                    );

            }

        }
    );

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        createMap();

        loadBuses();


        setInterval(
            loadBuses,
            3000
        );

    }
);

</script>


</body>

</html>
